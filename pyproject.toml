[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngfw"
version = "0.1.0"
description = "Security advisory & threat-intel crawler for NGFW rule sourcing"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "curl_cffi>=0.7.0",
    "selectolax>=0.3.21",
    "trafilatura>=1.12.0",
    "feedparser>=6.0.10",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "duckdb>=1.0.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.48.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "respx>=0.21.0",
]

[project.scripts]
ngfw = "src.cli:cli"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B027: open()/close() on our ABCs are deliberate no-op lifecycle hooks,
# not abstract methods subclasses are required to implement.
ignore = ["B027"]
